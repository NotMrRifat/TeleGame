[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegame"
version = "1.0.0"
description = "Serverless, plugin-based Telegram Multiplayer Gaming Platform"
readme = "README.md"
authors = [
    { name = "TeleGame Team", email = "admin@telegame.platform" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "fastapi>=0.140.2",
    "uvicorn>=0.32.0",
    "redis>=5.2.0",
    "pytz>=2024.2",
    "python-json-logger>=3.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto --cov=app --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 30

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "ARG001", "ARG002", "UP036", "UP042", "UP046", "N804", "SIM102"]

[tool.black]
line-length = 100
target-version = ['py311']
